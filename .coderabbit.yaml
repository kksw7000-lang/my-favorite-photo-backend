# .coderabbit.yaml (Backend - Express.js)

language: 'ko'

reviews:
  profile: 'assertive'
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  path_instructions:
    # ─── 공통 JS ───────────────────────────────────────────
    - path: '**/*.js'
      instructions: |
        - `console.log` 등 디버그용 로그가 남아있는지 확인해주세요.
        - 불필요한 주석이나 dead code가 없는지 확인해주세요.
        - 변수/함수명이 역할을 명확히 표현하는지 검토해주세요.
        - ESLint/Prettier 규칙을 위반하는 코드가 없는지 확인해주세요.

    # ─── 라우터 ────────────────────────────────────────────
    - path: '**/routes/**/*.js'
      instructions: |
        - 모든 엔드포인트에 인증/인가 미들웨어가 적절히 적용되어 있는지 확인해주세요.
        - HTTP 상태코드가 아래 팀 컨벤션을 따르는지 반드시 검토해주세요:
            - 200: GET/PUT/PATCH 성공 시 데이터 반환
            - 201: POST로 리소스 생성 성공
            - 204: DELETE 등 응답 바디 없는 성공
            - 400: 입력값 검증 실패 (필수값 누락, 형식 오류 등)
            - 401: 비로그인 / 토큰 만료
            - 403: 로그인됐으나 권한 없음 (타인 리소스 접근 등)
            - 404: 존재하지 않는 리소스 또는 잘못된 엔드포인트
            - 409: 이메일/아이디 등 유니크 제약 충돌
            - 422: 형식은 맞지만 비즈니스 로직 조건 미달 (잔액 부족, 재고 없음 등)
            - 429: 과도한 요청 (rate limit 초과)
            - 500: 서버 내부 런타임 에러 (catch 블록)
        - 에러 응답 바디에 스택 트레이스나 민감 정보가 노출되지 않는지 확인해주세요.

    # ─── 컨트롤러 ──────────────────────────────────────────
    - path: '**/controllers/**/*.js'
      instructions: |
        - 비즈니스 로직이 컨트롤러에 과도하게 집중되어 있지 않은지 확인해주세요 (서비스 레이어 분리).
        - 모든 async 함수에 try-catch 또는 에러 핸들러가 있는지 확인해주세요.
        - HTTP 상태코드 컨벤션 준수 여부를 검토해주세요 (routes 룰 참고).
        - req.body, req.params, req.query 값을 그대로 DB에 넘기는 코드가 없는지 확인해주세요.
        - 필수 파라미터 누락 시 400을 반환하는지 확인해주세요.

    # ─── 미들웨어 / JWT ─────────────────────────────────────
    - path: '**/middlewares/**/*.js'
      instructions: |
        - next() 호출 누락으로 요청이 멈추는 케이스가 없는지 확인해주세요.
        - 에러 미들웨어(err, req, res, next) 시그니처가 올바른지 검토해주세요.
        - JWT 검증 시 만료(401)와 위변조(403)를 구분해서 처리하는지 확인해주세요.
        - 토큰에서 추출한 userId를 req.user에 담아 컨트롤러로 전달하는 패턴을 따르는지 확인해주세요.
        - JWT secret이 하드코딩되지 않고 환경변수(.env)에서 불러오는지 확인해주세요.

    # ─── Prisma / DB ───────────────────────────────────────
    - path: '**/prisma/**'
      instructions: |
        - schema.prisma 변경 시 마이그레이션 파일이 함께 포함되어 있는지 확인해주세요.
        - 롤백 가능한 마이그레이션인지 확인해주세요.
        - 대용량 테이블 변경 시 락(lock) 이슈를 검토해주세요.
        - 새로운 유니크 제약 추가 시 기존 데이터와의 충돌 가능성을 검토해주세요.

    - path: '**/services/**/*.js'
      instructions: |
        - Prisma 트랜잭션이 필요한 작업(여러 테이블 동시 수정)에 $transaction이 사용되는지 확인해주세요.
        - N+1 쿼리 문제가 발생할 수 있는 패턴이 없는지 확인해주세요.
        - 민감한 필드(password 등)가 응답에서 제외되는지 확인해주세요.

    # ─── 테스트 ────────────────────────────────────────────
    - path: '**/*.test.js'
      instructions: |
        - 엣지 케이스와 실패 케이스(에러 응답, 빈 데이터 등)가 테스트되고 있는지 확인해주세요.
        - describe/it 설명이 테스트 의도를 명확히 표현하는지 검토해주세요.
        - 외부 의존성(DB, API)이 적절히 모킹되어 있는지 확인해주세요.

  path_filters:
    - '!**/node_modules/**'
    - '!**/dist/**'
    - '!**/*.lock'
    - '!**/generated/**'
    - '!**/__snapshots__/**'

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - 'dev'

chat:
  auto_reply: true

finishing_touches:
  docstrings:
    enabled: true

custom_instructions: |
  모든 리뷰 코멘트는 반드시 한국어로 작성해주세요.

  [커밋 메시지]
  커밋 타입이 아래 컨벤션을 따르는지 확인해주세요:
  - feat: 새로운 기능 추가
  - fix: 버그 수정
  - style: 코드 포맷팅, 세미콜론 등 스타일 변경 (논리 변경 없음)
  - refactor: 리팩토링 (기능 변화 없음)
  - design: CSS 등 사용자 UI 디자인 변경
  - comment: 주석 추가 및 변경
  - remove: 파일 삭제만 수행한 경우

  [코드 품질]
  - `console.log` 등 디버그 로그가 제거되었는지 확인해주세요.
  - 불필요한 주석이 제거되었는지 확인해주세요.
  - 로컬 빌드/테스트 성공 여부를 PR 체크리스트에서 확인해주세요.

  [입력값 검증]
  별도 validation 라이브러리를 사용하지 않으므로 아래를 꼼꼼히 확인해주세요:
  - 필수 파라미터 누락 여부 체크 후 400 반환하는지 확인해주세요.
  - 문자열 길이, 숫자 범위, 이메일 형식 등 수동 검증이 처리되는지 확인해주세요.
  - req.body, req.params, req.query 값을 그대로 DB에 넘기는 코드가 없는지 확인해주세요.

  [보안]
  - 환경변수(.env)가 코드에 하드코딩되지 않았는지 확인해주세요.
  - .env 파일이 PR에 포함되어 있지 않은지 확인해주세요.
